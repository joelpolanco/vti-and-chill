name: Google Indexing API ping

on:
  push:
    branches: [main]

# Don't fight ourselves on rapid pushes
concurrency:
  group: google-indexing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ping:
    name: Submit changed URLs to Google Indexing API
    runs-on: ubuntu-latest
    # Skip entirely if the secret isn't configured yet — keeps the run green
    # until you finish the GCP setup steps in the README.
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout repo (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if secret missing
        id: gate
        env:
          HAS_SECRET: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          if [[ "$HAS_SECRET" != "true" ]]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret not set — skipping. See .github/scripts/README.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Vercel deploy
        if: steps.gate.outputs.skip != 'true'
        run: sleep 75

      - name: Build URL list from changed files
        if: steps.gate.outputs.skip != 'true'
        id: build
        env:
          BEFORE: ${{ github.event.before }}
          AFTER:  ${{ github.event.after }}
          SITE: "https://www.vtiandchill.com"
        run: |
          set -euo pipefail

          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BEFORE" "$AFTER" || true)
          fi

          echo "Changed files in this push:"
          echo "$CHANGED" | sed 's/^/  /'

          # Same mapping rules as IndexNow: only public HTML pages.
          # Google's Indexing API takes one URL per call, so we only need
          # the URL list — no JSON wrapper.
          mapfile -t URLS < <(printf '%s\n' "$CHANGED" | awk -v site="$SITE" '
            /\.html$/ {
              if ($0 == "index.html") { print site "/"; next }
              print site "/" $0; next
            }
          ' | sort -u)

          if [[ ${#URLS[@]} -eq 0 ]]; then
            echo "No public HTML URLs changed in this push. Skipping Google Indexing."
            echo "count=0" >> "$GITHUB_OUTPUT"
            : > /tmp/urls.txt
            exit 0
          fi

          printf '%s\n' "${URLS[@]}" > /tmp/urls.txt
          echo "URLs to submit (${#URLS[@]}):"
          sed 's/^/  /' /tmp/urls.txt
          echo "count=${#URLS[@]}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true' && steps.build.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cryptography
        if: steps.gate.outputs.skip != 'true' && steps.build.outputs.count != '0'
        run: pip install --quiet cryptography

      - name: POST to Google Indexing API
        if: steps.gate.outputs.skip != 'true' && steps.build.outputs.count != '0'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          URL_LIST_FILE: /tmp/urls.txt
        run: python .github/scripts/google_indexing_ping.py
