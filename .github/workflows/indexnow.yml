name: IndexNow ping

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to submit"
        required: true
        default: "sitemap"
        type: choice
        options:
          - sitemap          # Submit every URL in sitemap.xml (full resubmission)
          - changed-since    # Submit URLs changed since a given Git ref
          - custom           # Submit a hand-typed list of URLs
      since_ref:
        description: "(changed-since only) Git ref to diff against, e.g. HEAD~5 or a commit SHA"
        required: false
        default: "HEAD~1"
      custom_urls:
        description: "(custom only) One URL per line"
        required: false
        default: ""

# Allow only one ping at a time so concurrent pushes don't spam IndexNow
concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ping:
    name: Submit URLs to IndexNow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Skip the deploy wait when the user manually re-runs against
      # already-deployed content. Push events still need it.
      - name: Wait for Vercel deploy (push events only)
        if: github.event_name == 'push'
        run: sleep 75

      - name: Build URL list
        id: build
        env:
          EVENT:    ${{ github.event_name }}
          BEFORE:   ${{ github.event.before }}
          AFTER:    ${{ github.event.after }}
          MODE:     ${{ github.event.inputs.mode }}
          SINCE:    ${{ github.event.inputs.since_ref }}
          CUSTOM:   ${{ github.event.inputs.custom_urls }}
          SITE:     "https://www.vtiandchill.com"
        run: |
          set -euo pipefail

          # path -> public URL helper. Only HTML pages + sitemap/llms/robots
          # qualify as IndexNow-eligible. Everything else is dropped.
          to_urls() {
            awk -v site="$SITE" '
              /\.html$/ {
                if ($0 == "index.html") { print site "/"; next }
                print site "/" $0; next
              }
              $0 == "sitemap.xml" { print site "/" $0; next }
              $0 == "llms.txt"    { print site "/" $0; next }
              $0 == "robots.txt"  { print site "/" $0; next }
            '
          }

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "Manual run. Mode = $MODE"

            case "$MODE" in
              sitemap)
                echo "Extracting URLs from sitemap.xml..."
                # Pull all <loc>...</loc> entries (case-insensitive, multi-line safe)
                mapfile -t URLS < <(grep -oE '<loc>[^<]+</loc>' sitemap.xml \
                  | sed -E 's#</?loc>##g' | sort -u)
                ;;

              changed-since)
                echo "Diffing changes since: $SINCE"
                CHANGED=$(git diff --name-only --diff-filter=ACMRT "$SINCE" HEAD || true)
                echo "Changed files:"
                echo "$CHANGED" | sed 's/^/  /'
                mapfile -t URLS < <(printf '%s\n' "$CHANGED" | to_urls | sort -u)
                ;;

              custom)
                echo "Using user-supplied URL list."
                # Trim whitespace, drop blank lines, accept only same-host URLs.
                mapfile -t URLS < <(printf '%s\n' "$CUSTOM" \
                  | sed 's/[[:space:]]*$//' \
                  | grep -E '^https://www\.vtiandchill\.com/' \
                  | sort -u)
                ;;

              *)
                echo "::error::Unknown mode: $MODE"
                exit 1
                ;;
            esac
          else
            # push event
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              CHANGED=$(git ls-files)
            else
              CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BEFORE" "$AFTER" || true)
            fi
            echo "Changed files in this push:"
            echo "$CHANGED" | sed 's/^/  /'
            mapfile -t URLS < <(printf '%s\n' "$CHANGED" | to_urls | sort -u)
          fi

          if [[ ${#URLS[@]} -eq 0 ]]; then
            echo "No URLs to submit. Skipping IndexNow."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # IndexNow accepts up to 10,000 URLs per call; far more than we'll ever have.
          echo "URLs to submit (${#URLS[@]}):"
          printf '  %s\n' "${URLS[@]}"

          jq -n \
            --arg host "www.vtiandchill.com" \
            --arg key  "d520aa54ae9340048550b8f2cb83c707" \
            --arg keyLoc "$SITE/d520aa54ae9340048550b8f2cb83c707.txt" \
            --argjson urls "$(printf '%s\n' "${URLS[@]}" | jq -R . | jq -s .)" \
            '{host: $host, key: $key, keyLocation: $keyLoc, urlList: $urls}' \
            > /tmp/indexnow.json

          echo "count=${#URLS[@]}" >> "$GITHUB_OUTPUT"

      - name: POST to IndexNow
        if: steps.build.outputs.count != '0'
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o /tmp/indexnow_resp.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/indexnow.json)
          echo "IndexNow HTTP $HTTP"
          echo "Response body:"
          cat /tmp/indexnow_resp.txt || true
          echo

          # 200 = OK, 202 = accepted (still success). Anything else = fail.
          if [[ "$HTTP" != "200" && "$HTTP" != "202" ]]; then
            echo "::error::IndexNow returned $HTTP"
            exit 1
          fi
          echo "::notice::Successfully submitted ${{ steps.build.outputs.count }} URL(s) to IndexNow."
